name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 217.71.200.78
          port: 2222
          username: sheila
          key: ${{SSH_PRIVATE_KEY}}
          script: "set -eu; cd /var/www/html/Laravel; git pull --ff-only origin main; npm ci; npm run build;"
